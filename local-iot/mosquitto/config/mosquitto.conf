# Mosquitto（MQTTブローカ）の設定

# 1883番ポートで，どのネットワークからの接続も受け付ける
listener 1883

# 受け取ったRetainメッセージなどを，再起動しても残す
persistence true
persistence_location /mosquitto/data/

# ログは画面（docker compose logs）に出す
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ---- 認証 ----------------------------------------------------------
# 演習の最初は，ユーザー名なしで接続できるようにしています（講習室の閉じたネットワーク用）．
allow_anonymous true

# ユーザー名とパスワードを必須にするときは（s09 参照）:
#   1. docker compose exec mosquitto mosquitto_passwd -c /mosquitto/data/passwd esp32
#      （パスワードを2回入力．ファイルはデータ用のボリュームに保存されます）
#   2. 上の allow_anonymous を false にし，下の行の # を外す
#   3. docker compose restart mosquitto
# password_file /mosquitto/data/passwd
